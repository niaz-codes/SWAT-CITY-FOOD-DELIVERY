<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Swat City Food Delivery admin panel - sign in to manage orders, riders, restaurants and payments."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Swat City · Admin Panel</title>
    <script>
      // Apply the saved theme before the first paint, so the panel never
      // flashes the wrong background while React boots.
      ;(function () {
        try {
          var stored = localStorage.getItem('admin-theme')
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : stored === 'system'
                ? prefersDark
                  ? 'dark'
                  : 'light'
                : prefersDark
                  ? 'dark'
                  : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (error) {
          /* storage unavailable - the light theme is a fine fallback */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
